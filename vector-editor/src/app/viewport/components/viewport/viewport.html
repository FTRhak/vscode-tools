<app-snap-bar [(mode)]="snapMode" />
<svg aria-hidden="true">
  @if (scene(); as scene) {
    <defs>
      @for (gradient of scene.gradients; track gradient.id) {
        @if (gradient.type === 'linear') {
          <linearGradient
            [attr.id]="gradient.id"
            gradientUnits="objectBoundingBox"
            [attr.gradientTransform]="gradientTransform(gradient)"
          >
            @for (stop of gradient.stops; track stop.id) {
              <stop
                [attr.offset]="stop.offset"
                [attr.stop-color]="stop.color"
                [attr.stop-opacity]="stop.opacity"
              />
            }
          </linearGradient>
        } @else {
          <radialGradient
            [attr.id]="gradient.id"
            gradientUnits="objectBoundingBox"
            [attr.gradientTransform]="gradientTransform(gradient)"
          >
            @for (stop of gradient.stops; track stop.id) {
              <stop
                [attr.offset]="stop.offset"
                [attr.stop-color]="stop.color"
                [attr.stop-opacity]="stop.opacity"
              />
            }
          </radialGradient>
        }
      }
    </defs>
  }
  @if (scene(); as scene) {
    <g [attr.transform]="cameraTransform()">
      <rect
        class="artboard"
        [attr.x]="scene.viewBox.x"
        [attr.y]="scene.viewBox.y"
        [attr.width]="scene.viewBox.width"
        [attr.height]="scene.viewBox.height"
      />
      @for (object of scene.objects; track object.id) {
        <g
          [attr.transform]="object.transform"
          [attr.opacity]="editing() && activeId() !== object.id ? 0.4 : null"
        >
          @if (object.kind === 'image') {
            @if (object.tracePaths.length > 0) {
              @for (path of object.tracePaths; track $index) {
                @if (object.traceOutlines) {
                  <path
                    [attr.d]="path.d"
                    fill="none"
                    [attr.stroke]="path.fill"
                    stroke-width="1"
                    vector-effect="non-scaling-stroke"
                    fill-rule="evenodd"
                  />
                } @else {
                  <path [attr.d]="path.d" [attr.fill]="path.fill" stroke="none" fill-rule="evenodd" />
                }
              }
            } @else if (object.href) {
              <image
                [attr.href]="object.href"
                x="0"
                y="0"
                [attr.width]="object.imageWidth"
                [attr.height]="object.imageHeight"
                [attr.preserveAspectRatio]="object.preserveAspectRatio"
              />
            } @else {
              <rect
                x="0"
                y="0"
                [attr.width]="object.imageWidth"
                [attr.height]="object.imageHeight"
                fill="none"
                stroke="#737373"
                stroke-dasharray="4 3"
                vector-effect="non-scaling-stroke"
              />
            }
            @if (selectedIds().has(object.id)) {
              <rect
                class="selection"
                x="0"
                y="0"
                [attr.width]="object.imageWidth"
                [attr.height]="object.imageHeight"
                fill="none"
                stroke="#1d4ed8"
                stroke-width="1.5"
                vector-effect="non-scaling-stroke"
                pointer-events="none"
              />
            }
          } @else if (object.strokeAlign === 'default') {
            <path
              [attr.d]="object.d"
              [attr.fill]="object.fill"
              [attr.stroke]="object.stroke"
              [attr.stroke-width]="object.strokeWidth"
              [attr.stroke-linecap]="object.strokeLinecap"
              [attr.stroke-linejoin]="object.strokeLinejoin"
              [attr.stroke-miterlimit]="object.strokeMiterlimit"
              [attr.stroke-opacity]="object.strokeOpacity"
              [attr.stroke-dasharray]="object.strokeDasharray"
              [attr.stroke-dashoffset]="object.strokeDashoffset"
              [attr.fill-rule]="object.fillRule"
            />
          } @else {
            @if (object.fill !== 'none') {
              <path
                [attr.d]="object.d"
                [attr.fill]="object.fill"
                stroke="none"
                [attr.fill-rule]="object.fillRule"
              />
            }
            @if (object.strokeAlign === 'inside') {
              <clipPath [attr.id]="object.clipId" clipPathUnits="userSpaceOnUse">
                <path [attr.d]="object.d" [attr.fill-rule]="object.fillRule" />
              </clipPath>
              <path
                [attr.d]="object.d"
                fill="none"
                [attr.stroke]="object.stroke"
                [attr.stroke-width]="object.strokeWidth * 2"
                [attr.stroke-linecap]="object.strokeLinecap"
                [attr.stroke-linejoin]="object.strokeLinejoin"
                [attr.stroke-miterlimit]="object.strokeMiterlimit"
                [attr.stroke-opacity]="object.strokeOpacity"
                [attr.stroke-dasharray]="object.strokeDasharray"
                [attr.stroke-dashoffset]="object.strokeDashoffset"
                [attr.clip-path]="'url(#' + object.clipId + ')'"
              />
            } @else if (object.maskRect; as maskRect) {
              <mask
                [attr.id]="object.maskId"
                maskUnits="userSpaceOnUse"
                maskContentUnits="userSpaceOnUse"
                [attr.x]="maskRect.x"
                [attr.y]="maskRect.y"
                [attr.width]="maskRect.width"
                [attr.height]="maskRect.height"
              >
                <rect
                  [attr.x]="maskRect.x"
                  [attr.y]="maskRect.y"
                  [attr.width]="maskRect.width"
                  [attr.height]="maskRect.height"
                  fill="white"
                />
                <path [attr.d]="object.d" fill="black" [attr.fill-rule]="object.fillRule" />
              </mask>
              <path
                [attr.d]="object.d"
                fill="none"
                [attr.stroke]="object.stroke"
                [attr.stroke-width]="object.strokeWidth * 2"
                [attr.stroke-linecap]="object.strokeLinecap"
                [attr.stroke-linejoin]="object.strokeLinejoin"
                [attr.stroke-miterlimit]="object.strokeMiterlimit"
                [attr.stroke-opacity]="object.strokeOpacity"
                [attr.stroke-dasharray]="object.strokeDasharray"
                [attr.stroke-dashoffset]="object.strokeDashoffset"
                [attr.mask]="'url(#' + object.maskId + ')'"
              />
            }
          }
          @if (selectedIds().has(object.id)) {
            <path
              class="selection"
              [attr.d]="object.d"
              fill="none"
              stroke="#1d4ed8"
              stroke-width="1.5"
              vector-effect="non-scaling-stroke"
              pointer-events="none"
            />
          }
        </g>
      }
      @for (point of emptyPoints(); track point.id) {
        <g class="empty-point" [class.selected]="point.selected" pointer-events="none">
          <line
            [attr.x1]="point.x - point.arm"
            [attr.y1]="point.y"
            [attr.x2]="point.x + point.arm"
            [attr.y2]="point.y"
          />
          <line
            [attr.x1]="point.x"
            [attr.y1]="point.y - point.arm"
            [attr.x2]="point.x"
            [attr.y2]="point.y + point.arm"
          />
        </g>
      }
      @for (origin of rotationOrigins(); track origin.id) {
        <g class="rotation-origin" pointer-events="none">
          <circle [attr.cx]="origin.x" [attr.cy]="origin.y" [attr.r]="origin.radius" />
          <line
            [attr.x1]="origin.x - origin.arm"
            [attr.y1]="origin.y"
            [attr.x2]="origin.x + origin.arm"
            [attr.y2]="origin.y"
          />
          <line
            [attr.x1]="origin.x"
            [attr.y1]="origin.y - origin.arm"
            [attr.x2]="origin.x"
            [attr.y2]="origin.y + origin.arm"
          />
        </g>
      }
      @if (anchorOverlay(); as overlay) {
        <g [attr.transform]="overlay.transform" pointer-events="none">
          @for (handle of overlay.handles; track handle.id) {
            <line
              class="handle-line"
              [attr.x1]="handle.x1"
              [attr.y1]="handle.y1"
              [attr.x2]="handle.x2"
              [attr.y2]="handle.y2"
            />
            <circle
              class="handle"
              [attr.cx]="handle.x2"
              [attr.cy]="handle.y2"
              [attr.r]="overlay.handleRadius"
            />
          }
          @for (anchor of overlay.anchors; track anchor.id) {
            <rect
              class="anchor"
              [class.selected]="anchor.selected"
              [attr.x]="anchor.x - overlay.anchorSize / 2"
              [attr.y]="anchor.y - overlay.anchorSize / 2"
              [attr.width]="overlay.anchorSize"
              [attr.height]="overlay.anchorSize"
            />
          }
        </g>
      }
      @if (penPreview(); as preview) {
        <g [attr.transform]="preview.transform" pointer-events="none">
          <path class="pen-preview" [attr.d]="preview.d" />
        </g>
      }
      @if (shapePreview(); as preview) {
        <path class="shape-preview" [attr.d]="preview" />
      }
      @if (imagePreview(); as preview) {
        <image
          class="image-preview"
          [attr.href]="preview.href"
          [attr.x]="preview.x"
          [attr.y]="preview.y"
          [attr.width]="preview.width"
          [attr.height]="preview.height"
          [attr.preserveAspectRatio]="preview.preserveAspectRatio"
        />
      }
      @if (marquee(); as rect) {
        <rect
          class="marquee"
          fill="#1d4ed8"
          fill-opacity="0.12"
          stroke="#1d4ed8"
          stroke-width="1"
          vector-effect="non-scaling-stroke"
          pointer-events="none"
          [attr.x]="rect.width < 0 ? rect.x + rect.width : rect.x"
          [attr.y]="rect.height < 0 ? rect.y + rect.height : rect.y"
          [attr.width]="rect.width < 0 ? -rect.width : rect.width"
          [attr.height]="rect.height < 0 ? -rect.height : rect.height"
        />
      }
    </g>
  }
</svg>
<app-shape-dialog
  [request]="shapeDialog()"
  (confirmed)="confirmShape($event)"
  (dismissed)="dismissShape()"
/>

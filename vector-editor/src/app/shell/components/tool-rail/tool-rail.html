<nav class="tool-rail" aria-label="Tools">
  @for (group of groups; track $index) {
    @if (group.label) {
      <div class="tool-divider" role="separator"></div>
    }
    @for (tool of group.tools; track tool.id) {
      <button
        type="button"
        class="chrome-button"
        [attr.aria-label]="tool.label"
        [attr.aria-keyshortcuts]="tool.shortcut"
        [attr.aria-pressed]="activeTool() === tool.id ? 'true' : 'false'"
        [attr.title]="tool.label"
        (click)="select(tool.id)"
      >
        <tool-icon [name]="tool.id" [glyph]="icons[tool.id]" />
      </button>
    }
  }
</nav>

<header class="top-bar">
  <div class="group" role="group" aria-label="File">
    <button type="button" class="chrome-button" (click)="newDocument()">New</button>
    <button type="button" class="chrome-button" (click)="openFile()">Open</button>
    <button
      type="button"
      class="chrome-button"
      data-file-save
      [disabled]="!hasDocument()"
      (click)="saveFile()"
    >
      Save
    </button>
    <p class="file-status" aria-live="polite">{{ status() }}</p>
  </div>
  <div class="mode" aria-live="polite">
    <button
      type="button"
      class="chrome-button"
      [attr.aria-label]="modeLabel() + ' mode'"
      (click)="toggleMode()"
    >
      {{ modeLabel() }}
    </button>
    @if (selectionKindLabel(); as kind) {
      <span class="selection-kind">{{ kind }}</span>
    }
  </div>
  <div class="group history" role="group" aria-label="History">
    <button type="button" class="chrome-button" [disabled]="!canUndo()" (click)="undo()">
      Undo
    </button>
    <button type="button" class="chrome-button" [disabled]="!canRedo()" (click)="redo()">
      Redo
    </button>
  </div>
</header>

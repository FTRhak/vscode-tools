<panel [panelName]="panelName">
  @if (frame(); as frame) {
    <svg
      class="preview"
      aria-hidden="true"
      [attr.viewBox]="frame.viewBox"
      [style.aspect-ratio]="frame.ratio"
    >
      @for (object of frame.scene.objects; track object.id) {
        <g [attr.transform]="object.transform">
          <path
            [attr.d]="object.d"
            [attr.fill]="object.fill"
            [attr.stroke]="object.stroke"
            [attr.stroke-width]="object.strokeWidth"
            [attr.fill-rule]="object.fillRule"
          />
        </g>
      }
    </svg>
  } @else {
    <p>Nothing to preview.</p>
  }
</panel>

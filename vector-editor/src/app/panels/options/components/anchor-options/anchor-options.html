<form class="options-form" (submit)="$event.preventDefault()">
  <label>
    Type
    <select [value]="pointTypeValue()" (change)="commitPointType($event)">
      @if (pointTypeValue() === 'mixed') {
        <option value="mixed" disabled>Mixed</option>
      }
      @for (option of pointTypeOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </label>
  <label>
    X
    <input
      type="number"
      step="any"
      [formField]="anchorForm.x"
      (blur)="commitAnchor('x')"
      (keydown.enter)="commitAnchor('x', $event)"
    />
  </label>
  <label>
    Y
    <input
      type="number"
      step="any"
      [formField]="anchorForm.y"
      (blur)="commitAnchor('y')"
      (keydown.enter)="commitAnchor('y', $event)"
    />
  </label>
  <label>
    Handle in X
    <input
      type="number"
      step="any"
      [formField]="anchorForm.handleInX"
      (blur)="commitHandle('in', 'x')"
      (keydown.enter)="commitHandle('in', 'x', $event)"
    />
  </label>
  <label>
    Handle in Y
    <input
      type="number"
      step="any"
      [formField]="anchorForm.handleInY"
      (blur)="commitHandle('in', 'y')"
      (keydown.enter)="commitHandle('in', 'y', $event)"
    />
  </label>
  <label>
    Handle out X
    <input
      type="number"
      step="any"
      [formField]="anchorForm.handleOutX"
      (blur)="commitHandle('out', 'x')"
      (keydown.enter)="commitHandle('out', 'x', $event)"
    />
  </label>
  <label>
    Handle out Y
    <input
      type="number"
      step="any"
      [formField]="anchorForm.handleOutY"
      (blur)="commitHandle('out', 'y')"
      (keydown.enter)="commitHandle('out', 'y', $event)"
    />
  </label>
  @if (showAnchorDelta()) {
    <label>
      dX
      <input
        type="number"
        step="any"
        [formField]="anchorForm.dx"
        (blur)="commitDelta()"
        (keydown.enter)="commitDelta($event)"
      />
    </label>
    <label>
      dY
      <input
        type="number"
        step="any"
        [formField]="anchorForm.dy"
        (blur)="commitDelta()"
        (keydown.enter)="commitDelta($event)"
      />
    </label>
  }
</form>

<section class="panel-section" aria-labelledby="options-heading">
  <h2 id="options-heading">Options</h2>
  @if (showObjectOptions()) {
    <form class="options-form" (submit)="$event.preventDefault()">
      <label>
        Name
        <input
          type="text"
          autocomplete="off"
          spellcheck="false"
          [formField]="optionsForm.name"
          (blur)="commitName()"
          (keydown.enter)="commitName($event)"
        />
      </label>
      <p class="meta">Layer {{ layerName() }}</p>
      <div class="checks">
        <label>
          <input
            type="checkbox"
            [checked]="visibleState() === true"
            [indeterminate]="visibleState() === null"
            (change)="commitFlag('visible', $event)"
          />
          Visible
        </label>
        <label>
          <input
            type="checkbox"
            [checked]="lockedState() === true"
            [indeterminate]="lockedState() === null"
            (change)="commitFlag('locked', $event)"
          />
          Locked
        </label>
      </div>
      <label>
        X
        <input
          type="number"
          step="any"
          [formField]="optionsForm.x"
          (blur)="commitNumber('x')"
          (keydown.enter)="commitNumber('x', $event)"
        />
      </label>
      <label>
        Y
        <input
          type="number"
          step="any"
          [formField]="optionsForm.y"
          (blur)="commitNumber('y')"
          (keydown.enter)="commitNumber('y', $event)"
        />
      </label>
      <label>
        Rotation
        <input
          type="number"
          step="any"
          [formField]="optionsForm.rotation"
          (blur)="commitNumber('rotation')"
          (keydown.enter)="commitNumber('rotation', $event)"
        />
      </label>
      <label>
        Scale X
        <input
          type="number"
          step="any"
          [formField]="optionsForm.scaleX"
          (blur)="commitNumber('scaleX')"
          (keydown.enter)="commitNumber('scaleX', $event)"
        />
      </label>
      <label>
        Scale Y
        <input
          type="number"
          step="any"
          [formField]="optionsForm.scaleY"
          (blur)="commitNumber('scaleY')"
          (keydown.enter)="commitNumber('scaleY', $event)"
        />
      </label>
      <p class="meta">Subpaths {{ subpathCount() }}</p>
      <p class="meta">Anchors {{ anchorCount() }}</p>
    </form>
  } @else if (showAnchorOptions()) {
    <form class="options-form" (submit)="$event.preventDefault()">
      <label>
        X
        <input
          type="number"
          step="any"
          [formField]="anchorForm.x"
          (blur)="commitAnchor('x')"
          (keydown.enter)="commitAnchor('x', $event)"
        />
      </label>
      <label>
        Y
        <input
          type="number"
          step="any"
          [formField]="anchorForm.y"
          (blur)="commitAnchor('y')"
          (keydown.enter)="commitAnchor('y', $event)"
        />
      </label>
      <label>
        Handle in X
        <input
          type="number"
          step="any"
          [formField]="anchorForm.handleInX"
          (blur)="commitHandle('in', 'x')"
          (keydown.enter)="commitHandle('in', 'x', $event)"
        />
      </label>
      <label>
        Handle in Y
        <input
          type="number"
          step="any"
          [formField]="anchorForm.handleInY"
          (blur)="commitHandle('in', 'y')"
          (keydown.enter)="commitHandle('in', 'y', $event)"
        />
      </label>
      <label>
        Handle out X
        <input
          type="number"
          step="any"
          [formField]="anchorForm.handleOutX"
          (blur)="commitHandle('out', 'x')"
          (keydown.enter)="commitHandle('out', 'x', $event)"
        />
      </label>
      <label>
        Handle out Y
        <input
          type="number"
          step="any"
          [formField]="anchorForm.handleOutY"
          (blur)="commitHandle('out', 'y')"
          (keydown.enter)="commitHandle('out', 'y', $event)"
        />
      </label>
      @if (showAnchorDelta()) {
        <label>
          dX
          <input
            type="number"
            step="any"
            [formField]="anchorForm.dx"
            (blur)="commitDelta()"
            (keydown.enter)="commitDelta($event)"
          />
        </label>
        <label>
          dY
          <input
            type="number"
            step="any"
            [formField]="anchorForm.dy"
            (blur)="commitDelta()"
            (keydown.enter)="commitDelta($event)"
          />
        </label>
      }
    </form>
  } @else {
    <p>Nothing selected.</p>
  }
</section>

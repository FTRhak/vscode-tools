<div class="object-options-head">
  <button
    type="button"
    class="chrome-button button-small button-icon"
    title="Reset transform"
    [attr.aria-label]="'Reset transform'"
    [disabled]="!canResetTransform()"
    (click)="resetTransform()"
  >
    <i class="icon">&#xe0ef;</i>
  </button>
  <button
    type="button"
    class="chrome-button button-small button-icon apply-transform"
    title="Apply transform"
    [attr.aria-label]="'Apply transform'"
    [disabled]="!canApplyTransform()"
    (click)="applyTransform()"
  >
    <i class="icon">&#xe0fd;</i>
  </button>
</div>
<form class="options-form" (submit)="$event.preventDefault()">
  <label>
    Name
    <input
      type="text"
      autocomplete="off"
      spellcheck="false"
      [formField]="optionsForm.name"
      (blur)="commitName()"
      (keydown.enter)="commitName($event)"
    />
  </label>
  <p class="meta">Layer {{ layerName() }}</p>
  <div class="checks">
    <label>
      <input
        type="checkbox"
        [checked]="visibleState() === true"
        [indeterminate]="visibleState() === null"
        (change)="commitFlag('visible', $event)"
      />
      Visible
    </label>
    <label>
      <input
        type="checkbox"
        [checked]="lockedState() === true"
        [indeterminate]="lockedState() === null"
        (change)="commitFlag('locked', $event)"
      />
      Locked
    </label>
  </div>
  <label>
    X
    <input type="number" step="any" [formField]="optionsForm.x" (blur)="commitNumber('x')" (keydown.enter)="commitNumber('x', $event)" />
  </label>
  <label>
    Y
    <input type="number" step="any" [formField]="optionsForm.y" (blur)="commitNumber('y')" (keydown.enter)="commitNumber('y', $event)" />
  </label>
  <label>
    Rotation
    <input
      type="number"
      step="any"
      [formField]="optionsForm.rotation"
      (blur)="commitNumber('rotation')"
      (keydown.enter)="commitNumber('rotation', $event)"
    />
  </label>
  <label>
    Pivot X
    <input type="number" step="any" [formField]="optionsForm.pivotX" (blur)="commitPivot('x')" (keydown.enter)="commitPivot('x', $event)" />
  </label>
  <label>
    Pivot Y
    <input type="number" step="any" [formField]="optionsForm.pivotY" (blur)="commitPivot('y')" (keydown.enter)="commitPivot('y', $event)" />
  </label>
  <label>
    Scale X
    <input
      type="number"
      step="any"
      [formField]="optionsForm.scaleX"
      (blur)="commitNumber('scaleX')"
      (keydown.enter)="commitNumber('scaleX', $event)"
    />
  </label>
  <label>
    Scale Y
    <input
      type="number"
      step="any"
      [formField]="optionsForm.scaleY"
      (blur)="commitNumber('scaleY')"
      (keydown.enter)="commitNumber('scaleY', $event)"
    />
  </label>
</form>

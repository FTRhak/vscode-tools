<panel [panelName]="panelName" icon="&#xe0f4;">
  @if (rows().length === 0) {
    <p>No history yet.</p>
  } @else {
    <ol
      class="history-list"
      cdkListbox
      [attr.aria-label]="panelName"
      [cdkListboxValue]="selection()"
      (cdkListboxValueChange)="jump($event.value[0])"
    >
      @for (row of rows(); track row.index) {
        <li class="chrome-button" [class.is-future]="row.future" [cdkOption]="row.index">
          {{ row.label }}
        </li>
      }
    </ol>
  }
</panel>

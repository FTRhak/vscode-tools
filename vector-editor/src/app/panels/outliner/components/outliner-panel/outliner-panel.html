<panel [panelName]="panelName" [icon]="'&#xe0f5;'">
  @if (hasDocument()) {
    <div>
      <button type="button" class="chrome-button add-layer" title="Add layer" (click)="addLayer()">
        <i class="icon">&#xe0e6;</i>
      </button>
    </div>
    <div class="tree" role="tree" aria-label="Layers" (keydown)="onTreeKeydown($event)">
      @for (layer of layers(); track layer.id) {
        <div
          class="layer"
          role="treeitem"
          [attr.aria-expanded]="layer.expanded"
          [attr.aria-level]="1"
          [attr.data-tree-key]="'layer:' + layer.id"
          [tabindex]="activeFocusKey() === 'layer:' + layer.id ? 0 : -1"
        >
          <div class="tree-row layer-row" (click)="onLayerClick(layer.id)">
            <span class="twist" aria-hidden="true">
              @if (layer.expanded) {
                <i class="icon">&#xe0e9;</i>
              } @else {
                <i class="icon">&#xe0ec;</i>
              }
            </span>
            <button
              type="button"
              class="icon-button"
              [attr.aria-label]="(layer.visible ? 'Hide ' : 'Show ') + layer.name"
              [attr.aria-pressed]="layer.visible"
              (click)="toggleLayerFlag(layer, 'visible', $event)"
            >
              <span aria-hidden="true">
                @if (layer.visible) {
                  <i class="icon">&#xe0e0;</i>
                } @else {
                  <i class="icon">&#xe0e1;</i>
                }
              </span>
            </button>
            <button
              type="button"
              class="icon-button"
              [attr.aria-label]="(layer.locked ? 'Unlock ' : 'Lock ') + layer.name"
              [attr.aria-pressed]="layer.locked"
              (click)="toggleLayerFlag(layer, 'locked', $event)"
            >
              <span aria-hidden="true">
                @if (layer.locked) {
                  <i class="icon">&#xe0e2;</i>
                } @else {
                  <i class="icon">&#xe0e3;</i>
                }
              </span>
            </button>
            <input
              class="layer-name"
              type="text"
              autocomplete="off"
              spellcheck="false"
              [value]="layer.name"
              [attr.aria-label]="'Rename ' + layer.name"
              (click)="$event.stopPropagation()"
              (keydown)="$event.stopPropagation()"
              (blur)="renameLayer(layer.id, $event)"
              (keydown.enter)="renameLayer(layer.id, $event)"
            />
            <button
              type="button"
              class="icon-button"
              [attr.aria-label]="'Move ' + layer.name + ' forward'"
              [disabled]="!layer.canMoveForward"
              (click)="moveLayer(layer.id, layer.index - 1, $event)"
            >
              <span aria-hidden="true">
                <i class="icon">&#xe0e4;</i>
              </span>
            </button>
            <button
              type="button"
              class="icon-button"
              [attr.aria-label]="'Move ' + layer.name + ' backward'"
              [disabled]="!layer.canMoveBackward"
              (click)="moveLayer(layer.id, layer.index + 1, $event)"
            >
              <span aria-hidden="true">
                <i class="icon">&#xe0e5;</i>
              </span>
            </button>
          </div>
          @if (layer.expanded) {
            <div class="group" role="group">
              @for (object of layer.objects; track object.id) {
                <div
                  class="tree-row object-row"
                  role="treeitem"
                  [class.active]="object.active"
                  [attr.aria-selected]="object.selected"
                  [attr.aria-level]="2"
                  [attr.data-tree-key]="'object:' + object.id"
                  [tabindex]="activeFocusKey() === 'object:' + object.id ? 0 : -1"
                  (click)="onObjectClick(object.id, $event)"
                >
                  <button
                    type="button"
                    class="icon-button"
                    [attr.aria-label]="(object.visible ? 'Hide ' : 'Show ') + object.name"
                    [attr.aria-pressed]="object.visible"
                    (click)="toggleObjectFlag(object, 'visible', $event)"
                  >
                    <span aria-hidden="true">
                      @if (object.visible) {
                        <i class="icon">&#xe0e0;</i>
                      } @else {
                        <i class="icon">&#xe0e1;</i>
                      }
                    </span>
                  </button>
                  <button
                    type="button"
                    class="icon-button"
                    [attr.aria-label]="(object.locked ? 'Unlock ' : 'Lock ') + object.name"
                    [attr.aria-pressed]="object.locked"
                    (click)="toggleObjectFlag(object, 'locked', $event)"
                  >
                    <span aria-hidden="true">
                      @if (object.locked) {
                        <i class="icon">&#xe0e2;</i>
                      } @else {
                        <i class="icon">&#xe0e3;</i>
                      }
                    </span>
                  </button>
                  <span class="object-name">{{ object.name }}</span>
                </div>
              }
            </div>
          }
        </div>
      }
    </div>
  } @else {
    <p>No objects yet.</p>
  }
</panel>

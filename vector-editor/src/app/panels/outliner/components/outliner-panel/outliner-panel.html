<panel [panelName]="panelName" [icon]="'&#xe0f5;'">
  @if (hasDocument()) {
    <div class="outliner-actions">
      <button type="button" class="chrome-button add-layer" title="Add layer" (click)="addLayer()">
        <i class="icon">&#xe0e6;</i>
      </button>
      <button
        type="button"
        class="chrome-button add-path"
        title="Add path to the selected layer"
        [disabled]="!canAddPath()"
        (click)="addPath()"
      >
        Add path
      </button>
      <button
        type="button"
        class="chrome-button button-small button-icon delete-object"
        title="Delete object"
        aria-label="Delete object"
        [disabled]="!canDelete()"
        (click)="deleteSelected()"
      >
        <i class="icon" aria-hidden="true">&#xe0e7;</i>
      </button>
      <button
        type="button"
        class="chrome-button button-small button-icon delete-layer"
        title="Delete layer"
        aria-label="Delete layer"
        [disabled]="!canDeleteLayer()"
        (click)="deleteSelectedLayer()"
      >
        <i class="icon" aria-hidden="true">&#xe0e7;</i>
      </button>
    </div>
    <div class="tree" role="tree" aria-label="Layers" (keydown)="onTreeKeydown($event)">
      @for (layer of layers(); track layer.id) {
        <div
          class="layer"
          role="treeitem"
          [attr.aria-expanded]="layer.expanded"
          [attr.aria-selected]="layer.selected"
          [attr.aria-level]="1"
          [attr.data-tree-key]="'layer:' + layer.id"
          [tabindex]="activeFocusKey() === 'layer:' + layer.id ? 0 : -1"
        >
          <app-outliner-layer-row
            [layer]="layer"
            (selected)="onLayerClick(layer.id)"
            (expandedToggled)="onTwistClick(layer.id, $event)"
            (visibilityToggled)="toggleLayerFlag(layer, 'visible', $event)"
            (lockToggled)="toggleLayerFlag(layer, 'locked', $event)"
            (renamed)="renameLayer(layer.id, $event)"
            (movedForward)="moveLayer(layer.id, layer.index - 1, $event)"
            (movedBackward)="moveLayer(layer.id, layer.index + 1, $event)"
          />
          @if (layer.expanded) {
            <div class="group" role="group">
              @for (object of layer.objects; track object.id) {
                <app-outliner-object-row
                  [object]="object"
                  [focused]="activeFocusKey() === 'object:' + object.id"
                  (selected)="onObjectClick(object.id, $event)"
                  (visibilityToggled)="toggleObjectFlag(object, 'visible', $event)"
                  (lockToggled)="toggleObjectFlag(object, 'locked', $event)"
                />
              }
            </div>
          }
        </div>
      }
    </div>
  } @else {
    <p>No objects yet.</p>
  }
</panel>

<label class="axis">
  Axis
  <div class="segmented">
    <button type="button" [attr.aria-pressed]="modifier().axis === 'x' || modifier().axis === 'xy'" (click)="toggleAxis('x')">X</button>
    <button type="button" [attr.aria-pressed]="modifier().axis === 'y' || modifier().axis === 'xy'" (click)="toggleAxis('y')">Y</button>
  </div>
</label>
<label class="center-point">
  Empty point
  <select [value]="modifier().centerPointId ?? ''" (change)="commitCenterPoint($event)">
    <option value="">Object center</option>
    @for (point of emptyPoints(); track point.id) {
      <option [value]="point.id">{{ point.name }}</option>
    }
  </select>
</label>

<fieldset class="axis">
  <legend>Axis</legend>
  <label>
    <input
      type="radio"
      [name]="'axis-' + modifier().id"
      [checked]="modifier().axis === 'x'"
      (change)="commitAxis('x')"
    />
    X
  </label>
  <label>
    <input
      type="radio"
      [name]="'axis-' + modifier().id"
      [checked]="modifier().axis === 'y'"
      (change)="commitAxis('y')"
    />
    Y
  </label>
  <label>
    <input
      type="radio"
      [name]="'axis-' + modifier().id"
      [checked]="modifier().axis === 'xy'"
      (change)="commitAxis('xy')"
    />
    Both
  </label>
</fieldset>

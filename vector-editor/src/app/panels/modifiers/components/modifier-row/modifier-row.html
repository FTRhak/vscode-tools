<article class="modifier-row">
  <div class="modifier-head">
    <button
      type="button"
      class="chrome-button"
      cdkDragHandle
      [attr.aria-label]="'Reorder ' + title()"
    >
      <i class="icon">&#xe0fe;</i>
    </button>
    <h3>{{ title() }}</h3>
    <button type="button" class="chrome-button" (click)="toggleEnabled()">
      @if (modifier().enabled) {
        <i class="icon">&#xe0e0;</i>
      } @else {
        <i class="icon">&#xe0e1;</i>
      }
    </button>
    <div class="modifier-actions">
      <button
        type="button"
        class="chrome-button"
        title="Apply modifier {{ title() }}"
        [attr.aria-label]="'Apply ' + title()"
        (click)="apply()"
      >
        <i class="icon">&#xe0fd;</i>
      </button>
      <button
        type="button"
        class="chrome-button"
        title="Remove modifier {{ title() }}"
        [attr.aria-label]="'Remove ' + title()"
        (click)="remove()"
      >
        <i class="icon">&#xe0e7;</i>
      </button>
    </div>
  </div>
  @if (arrayModifier(); as array) {
    <array-modifier-fields [modifier]="array" (committed)="patch($event)" />
  } @else if (mirrorModifier(); as mirror) {
    <mirror-modifier-fields [modifier]="mirror" (committed)="patch($event)" />
  } @else if (bevelModifier(); as bevel) {
    <bevel-modifier-fields [modifier]="bevel" (committed)="patch($event)" />
  } @else if (booleanModifier(); as booleanOp) {
    <boolean-modifier-fields
      [modifier]="booleanOp"
      [peers]="peers()"
      (committed)="patch($event)"
    />
  }
</article>

<panel [panelName]="panelName" [icon]="'&#xe102;'">
  <div class="tool-list">
    @for (group of groups; track $index) {
      @if (group.label) {
        <h3 class="tool-group">{{ group.label }}</h3>
      }
      @for (tool of group.tools; track tool.id) {
        <tool-button
          [tool]="tool"
          [icon]="icons[tool.id]"
          [active]="activeTool() === tool.id"
          (selected)="select($event)"
        />
      }
    }
  </div>
  @if (activeTool() === 'image') {
    <label class="image-link">
      <input
        type="checkbox"
        [checked]="linked() === 'link'"
        (change)="setPlacement($event)"
      />
      Link
    </label>
  }
</panel>

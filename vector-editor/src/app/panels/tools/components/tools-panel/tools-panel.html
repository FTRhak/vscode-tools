<panel [panelName]="panelName" [icon]="'&#xe102;'">
  <div class="tool-list">
    @for (tool of tools; track tool.id) {
      <tool-button
        [tool]="tool"
        [icon]="icons[tool.id]"
        [active]="activeTool() === tool.id"
        (selected)="select($event)"
      />
    }
  </div>
</panel>
